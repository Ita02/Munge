name: Otomatiki ya Wallet

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jenga_mafaili:
    runs-on: ubuntu-latest
    steps:
      - name: Vuta Repository Yako
        uses: actions/checkout@v4

      - name: Weka Python na Ugawanye Anwani
        run: |
          python -c '
          import os
          import urllib.request

          url = "https://raw.githubusercontent.com/ita02/Munge/main/orodha_ya_anwani.txt"
          print("Inapakua orodha ya anwani...")
          
          try:
              with urllib.request.urlopen(url) as response:
                  html = response.read().decode("utf-8")
                  anwani_zote = [line.strip() for line in html.splitlines() if line.strip()]
          except Exception as e:
              print(f"Imeshindikana kupakua faili: {e}")
              anwani_zote = []
          
          print(f"Jumla ya anwani zilizopatikana: {len(anwani_zote)}")
          
          if len(anwani_zote) > 0:
              idadi_ya_wallet = 100
              mafaili_kwa_kila_wallet = 5
              ukubwa_wa_faili = 100
              index = 0
              
              for w in range(1, idadi_ya_wallet + 1):
                  wallet_folder = f"wallet_{w}"
                  os.makedirs(wallet_folder, exist_ok=True)
                  
                  for f_num in range(1, mafaili_kwa_kila_wallet + 1):
                      chunk = anwani_zote[index: index + ukubwa_wa_faili]
                      index += ukubwa_wa_faili
                      
                      if not chunk:
                          break
                          
                      faili_jina = os.path.join(wallet_folder, f"kundi_{f_num}.txt")
                      with open(faili_jina, "w", encoding="utf-8") as out:
                          out.write("\n".join(chunk))
              print("Folda na mafaili yametengenezwa kikamilifu!")
          else:
              print("Orodha ya anwani ni tupu au haikusomeka.")
          '

      - name: Hifadhi Kwenye GitHub Yako
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "Ongeza folda za wallet na anwani zake moja kwa moja" || echo "Hakuna mabadiliko ya kuhifadhi"
          git push
